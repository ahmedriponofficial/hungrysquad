<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hungry Squad">
<meta name="theme-color" content="#5B4FE5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Hungry Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== iOS grouped-list system ============================== */
  :root{
    --bg:#EEEFFB;                 /* soft lavender-periwinkle, like Circles */
    --group:#FFFFFF;
    --group2:#F3F3FC;
    --fill:#EAEAF9;
    --ink:#1A1A2E; --ink2:#4A4A63; --ink3:#6E6E88;
    --sep:rgba(60,60,90,.12);
    --hair:rgba(60,60,90,.08);
    --brand:#5B4FE5; --brandInk:#FFF; --brandSoft:rgba(91,79,229,.11);
  --brandGrad:linear-gradient(135deg,#6C5DF0 0%,#8B5CF6 100%);
  --brandGlow:0 14px 32px rgba(91,79,229,.30);
    --pos:#1E8E3E; --posBg:#E1F5E6;
    --neg:#D6473C; --negBg:#FBE6E4;
    --r:24px; --rsm:16px; --rfull:999px;
    --card:0 4px 16px rgba(60,50,150,.07),0 1px 3px rgba(60,50,150,.05);
    --nav:rgba(255,255,255,.90);
    --navShadow:0 8px 28px rgba(60,50,150,.14),0 0 0 .5px rgba(60,50,150,.04);
  }
  html[data-theme="dark"]{
    --bg:#000000;
    --group:#1C1C1E;
    --group2:#2C2C2E;
    --fill:#2C2C2E;
    --ink:#FFFFFF; --ink2:#EBEBF5; --ink3:#9E9EA8;
    --sep:rgba(84,84,88,.55);
    --hair:rgba(255,255,255,.24);
    --brand:#8B7EFF; --brandInk:#FFF; --brandSoft:rgba(139,126,255,.22);
  --brandGrad:linear-gradient(135deg,#6C5DF0 0%,#9061F9 100%);
  --brandGlow:0 14px 34px rgba(91,79,229,.4);
    --pos:#30D158; --posBg:rgba(48,209,88,.16);
    --neg:#FF453A; --negBg:rgba(255,69,58,.16);
    --card:0 2px 10px rgba(0,0,0,.35);
    --nav:rgba(28,28,30,.86);
    --navShadow:0 8px 28px rgba(0,0,0,.65),0 0 0 .5px rgba(255,255,255,.08);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;max-width:100%}
  /* one continuous background — no seams anywhere, even on short pages.
     overflow-x:hidden also stops iOS from shifting the whole page sideways
     when the keyboard opens and tries to scroll a focused field into view. */
  html{background:var(--bg);height:100%;overflow-x:hidden;width:100%}
  body{background:var(--bg);min-height:100vh;min-height:100dvh;overflow-x:hidden;width:100%}
  header,main,.section{background:var(--bg)}
  html,body{margin:0;padding:0}
  body{color:var(--ink);
    font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;letter-spacing:-0.01em;
    padding-bottom:150px;-webkit-font-smoothing:antialiased}
  .num{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-0.2px}
  .hero-num,.cook-name,.kv.total .v{font-family:inherit;letter-spacing:-0.3px}

  /* ---- Header ---- */
  header{padding:18px 20px 2px;border:none;box-shadow:none;position:static}
  .wrap{max-width:640px;margin:0 auto}
  .brandline{display:flex;justify-content:space-between;align-items:center;gap:18px}
  .greet{min-width:0;flex:1 1 auto}
  .greetdate{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--brand);
    margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdright{position:relative;display:flex;align-items:center;flex-shrink:0}
  .hdright .monthbtn{margin-top:0}
  h1{margin:-2px 0 0;font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:700;letter-spacing:-0.3px;line-height:1.1;padding-bottom:4px}
  .sub{color:var(--ink3);font-size:14px;margin-top:4px;letter-spacing:-0.01em}
  .status{position:absolute;right:0;bottom:calc(100% + 6px);font-size:11px;font-weight:600;
    text-align:right;white-space:nowrap;padding:0;min-height:0}

  .monthbtn{margin-top:0;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    background:var(--brandSoft);border:none;border-radius:14px;
    padding:9px 12px;cursor:pointer;font-family:inherit;font-size:13px;
    font-weight:700;color:var(--brand);letter-spacing:-0.1px;box-shadow:none}
  .monthbtn:active{opacity:.6}
  .monthbtn .mcal{width:15px;height:15px;stroke-width:2}
  .monthbtn .mchev{width:12px;height:12px;stroke-width:2.6;opacity:.75}
  .monthbtn:active{opacity:.55}
  .monthbtn svg.mchev{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round}
  .monthbtn svg.mcal{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;
    stroke-linecap:round;stroke-linejoin:round}

  main{max-width:640px;margin:0 auto;padding:18px 16px 0}
  .section{border:none;padding:0;box-shadow:none}
  .stack{display:flex;flex-direction:column;gap:26px}
  .stack-sm{display:flex;flex-direction:column;gap:14px}

  /* group header sits outside the card */
  h2,h3{margin:0 0 10px 4px;font-size:11px;font-weight:800;
    letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
  .hint{font-size:13px;color:var(--ink3);line-height:1.45;margin:9px 4px 0;
    letter-spacing:-0.005em;overflow-wrap:anywhere}
  .hero .hint,.cookcard .hint,.group .hint,.hero-hint{margin-left:0;margin-right:0}

  /* ---- The card ---- */
  .group,.panel,.mrow,.stat{
    background:var(--group);border-radius:var(--r);
    border:1.5px solid var(--hair);box-shadow:var(--card);overflow:hidden}
  .panel{padding:0}
  .mrow{margin-bottom:0;box-shadow:var(--card)}
  .mrow:active{box-shadow:var(--card)}
  .divider{margin-top:30px;padding-top:0;border:none}

  /* highlighted card for the numbers that matter most */
  .group.key,.panel.key{border:2.5px solid var(--brand);
    box-shadow:0 2px 10px var(--brandSoft)}

  /* ---- Rows ---- */
  .minirow>span:first-child{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.1px}
  .kv,.trow,.minirow,.lrow{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:13px 18px;font-size:15px;position:relative;border:none;min-height:48px}
  .kv+.kv::before,.trow+.trow::before,.minirow+.minirow::before,.lrow+.lrow::before{
    content:"";position:absolute;left:18px;right:0;top:0;height:.5px;background:var(--sep)}
  .kv .k,.lrow .k{color:var(--ink);font-weight:600}
  .kv .v{color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:600}
  .kv.total{background:var(--group)}
  .kv.total .k{font-weight:600;font-size:15px}
  .kv.total .v{color:var(--ink);font-weight:700;font-size:24px;letter-spacing:-0.025em}
  .lrow{font-size:13px;padding:9px 18px;min-height:0}
  .lrow .k{color:var(--ink3)}
  .lrow.bold{font-weight:600}
  /* Cooking-today card — quiet line, warm gradient, 3D pot for members */
  .cookcard{display:flex;align-items:center;gap:12px;border-radius:20px;padding:13px 15px;
    background:linear-gradient(115deg,#FFFFFF 0%,#FFFFFF 42%,#FFF3E4 78%,#FFE7D0 100%);
    border:1px solid rgba(201,122,34,.16);box-shadow:var(--card)}
  html[data-theme="dark"] .cookcard{background:linear-gradient(115deg,#1C1C1E 0%,#1C1C1E 42%,#2A2116 80%,#33261A 100%);
    border-color:rgba(255,190,120,.16)}
  .cookcard.waiting{opacity:.82}
  .cook-bar{width:3px;align-self:stretch;border-radius:3px;background:#F59E0B;flex-shrink:0}
  .cookcard.waiting .cook-bar{background:var(--sep)}
  .cook-t{min-width:0;flex:1}
  .cook-k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#A9761F}
  html[data-theme="dark"] .cook-k{color:#E7B75C}
  .cookcard.waiting .cook-k{color:var(--ink3)}
  .cook-n{font-size:19px;font-weight:700;letter-spacing:-0.3px;line-height:1.3;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:1px}
  .cook-n.none{font-size:16px;color:var(--ink3);font-weight:600}
  .cook-s{font-size:11px;font-weight:600;color:var(--ink3);margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cook-sk{text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:700}
  .cook-sv{color:var(--ink2);font-weight:700}
  .cook-sv.muted{color:var(--ink3);font-weight:600}
  .cook-go{border:none;background:#8A5A12;color:#FFF8EE;font-family:inherit;
    font-size:12px;font-weight:700;padding:9px 14px;border-radius:var(--rfull);
    cursor:pointer;flex-shrink:0;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    box-shadow:0 3px 10px rgba(138,90,18,.22)}
  .cook-go.solid{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(91,79,229,.28)}
  html[data-theme="dark"] .cook-go{background:#F0C776;color:#2B2116;box-shadow:none}
  .cook-go:active{opacity:.75}
  .cookcard .i3dwrap{width:44px;height:44px}
  .cookcard .i3dwrap .i3d{width:37px;height:37px}
  .cook-go:active{opacity:.7}
  .i3dwrap{position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    width:50px;height:50px}
  .i3dwrap::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle,#FFD9A8 0%,rgba(255,217,168,0) 68%);opacity:.9}
  html[data-theme="dark"] .i3dwrap::before{opacity:.35}
  .i3dwrap .i3d{position:relative;width:42px;height:42px;
    filter:drop-shadow(0 4px 8px rgba(160,100,30,.22))}
  .cookcard.waiting .i3d{filter:grayscale(.75);opacity:.65}
  .vchips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px 2px}
  .vchip{border:1px solid var(--hair);background:var(--group2);color:var(--ink2);
    font-family:inherit;font-size:12px;font-weight:600;padding:6px 11px;
    border-radius:var(--rfull);cursor:pointer}
  .vchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .daychips{display:flex;gap:7px;overflow-x:auto;margin-top:6px;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
  .daychip{flex:0 0 auto;width:52px;border:1px solid var(--hair);background:var(--group2);
    border-radius:14px;padding:8px 4px;cursor:pointer;font-family:inherit;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:1px}
  .daychip .dc-d{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
  .daychip .dc-n{font-size:17px;font-weight:700;color:var(--ink);font-family:"JetBrains Mono",monospace}
  .daychip .dc-m{font-size:9.5px;font-weight:600;color:var(--ink3)}
  .daychip .dc-t{position:absolute;top:5px;right:7px;color:#F59E0B;font-size:14px;line-height:1}
  .daychip.on{background:var(--brand);border-color:var(--brand)}
  .daychip.on .dc-d,.daychip.on .dc-n,.daychip.on .dc-m{color:#fff}
  .pill-wait{display:inline-flex;background:var(--warnBg,#FFF0DC);color:var(--warn,#B36A00);
    border-radius:var(--rfull);padding:5px 11px;font-size:11px;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase}
  .pill-ok{display:inline-flex;background:var(--posBg);color:var(--pos);border-radius:var(--rfull);
    padding:4px 10px;font-size:11px;font-weight:700}
  .pill-no{display:inline-flex;background:var(--negBg);color:var(--neg);border-radius:var(--rfull);
    padding:4px 10px;font-size:11px;font-weight:700}
  .clashbox{background:#FFF0DC;color:#B36A00;border-radius:11px;padding:9px 11px;
    font-size:12px;font-weight:600;margin-top:9px;line-height:1.45}
  .reqacts{display:flex;gap:8px;margin-top:11px}
  .reqacts button{flex:1;border:none;font-family:inherit;font-size:13.5px;font-weight:700;
    padding:11px;border-radius:12px;cursor:pointer}
  .req-ok{background:var(--pos);color:#fff}
  .req-no{background:var(--negBg);color:var(--neg)}
  .row-wait{display:flex}
  .plink{display:flex;align-items:center;gap:10px;padding:9px 0;position:relative}
  .plink+.plink::before{content:"";position:absolute;left:48px;right:0;top:0;height:1px;background:var(--sep)}
  .plink .circ-ic,.plink .isq{width:34px;height:34px;border-radius:50%;font-size:12px;flex-shrink:0}
  .plink-t{flex:1;min-width:0}
  .plink-n{display:block;font-size:14px;font-weight:600}
  .plink-c{display:block;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink3);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini{border:none;background:var(--fill);color:var(--brand);font-family:inherit;font-size:11.5px;
    font-weight:700;padding:7px 11px;border-radius:var(--rfull);cursor:pointer;flex-shrink:0}
  .mini.dg{color:var(--neg)}
  /* rotation strip */
  .rota{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rota-cell{background:var(--group2);border-radius:14px;padding:11px 12px;
    display:flex;flex-direction:column;gap:3px}
  .rota-cell.now{background:var(--brandSoft)}
  .rota-k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
  .rota-cell.now .rota-k{color:var(--brand)}
  .rota-k{font-weight:800}
  .rota-v{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.02em}
  .rota-v.muted{color:var(--ink3);font-weight:600}
  /* combined meals + cooked table */
  .tallyhead,.tallyrow{display:grid;grid-template-columns:1fr 56px 56px;align-items:center;
    gap:8px;padding:10px 14px}
  .tallyhead{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink3);background:var(--group2)}
  .tallyhead span:not(:first-child),.tallyrow span:not(:first-child){text-align:center}
  .thico{display:flex;align-items:center;justify-content:center}
  .thico svg{width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}
  .tallyrow+.tallyrow{border-top:.5px solid var(--sep)}
  .tallyrow .tname{display:flex;align-items:center;gap:10px;min-width:0}
  .tallyrow .tname .circ-ic,.tallyrow .tname .isq{width:34px;height:34px;border-radius:50%;font-size:14px}
  .tnametxt{font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .tflag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    background:var(--fill);color:var(--ink3);padding:3px 7px;border-radius:var(--rfull);flex-shrink:0}
  .tallyrow .tmeals{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .tallyrow .tcook{font-size:15px;font-weight:700;color:var(--brand);
    background:var(--brandSoft);border-radius:10px;padding:6px 0;font-variant-numeric:tabular-nums}
  /* member rows + options sheet */
  .mrow2{display:flex;align-items:center;gap:11px;background:var(--group2);
    border-radius:16px;padding:9px 11px;margin-bottom:8px}
  .mrow2.gone{opacity:.72}
  .mrow2-n{width:15px;text-align:center;font-size:12px;font-weight:600;color:var(--ink3);flex-shrink:0}
  .mrow2 .circ-ic,.mrow2 .isq{width:38px;height:38px;border-radius:50%;font-size:14px;flex-shrink:0}
  .mrow2-t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .mrow2-name{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow2-sub{font-size:11px;font-weight:500;color:var(--ink3);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow2-sub .off{color:var(--ink3)}
  .cdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);
    margin-right:4px;vertical-align:middle}
  .mrow2-acts{display:flex;align-items:center;gap:2px;flex-shrink:0}
  .mscrim{position:fixed;inset:0;background:rgba(20,18,45,.38);z-index:40}
  .msheet{position:fixed;left:0;right:0;bottom:0;z-index:50;
    padding:0 10px calc(12px + env(safe-area-inset-bottom,0px))}
  .msheet-in{max-width:420px;margin:0 auto;background:var(--group);border-radius:22px;
    box-shadow:0 -6px 30px rgba(30,20,80,.22);overflow:hidden}
  .msheet-head{display:flex;align-items:center;gap:11px;padding:14px 16px;
    border-bottom:1px solid var(--sep)}
  .msheet-act{display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;
    font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);padding:13px 16px;
    cursor:pointer;text-align:left;position:relative}
  .msheet-act+.msheet-act::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;
    background:var(--sep)}
  .msheet-act>span{flex:1;min-width:0}
  .msheet-act svg{width:19px;height:19px;stroke:var(--ink3);fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .msheet-act.as-row{cursor:default}
  .msheet-act.dg{color:var(--neg)}
  .msheet-act.dg svg{stroke:var(--neg)}
  .msheet-act .joindate{min-width:0;width:auto;text-align:right;font-size:13px;border-bottom:none}
  .msheet-pad{padding:14px 16px}
  .msheet-cancel{display:block;width:100%;max-width:420px;margin:8px auto 0;background:var(--group);
    border:none;border-radius:18px;padding:14px;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--brand);cursor:pointer;box-shadow:0 -2px 16px rgba(30,20,80,.10)}
  .iconbtn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;
    color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-weight:700}
  .iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .iconbtn.on{color:var(--brand);background:var(--brandSoft)}
  .iconbtn.danger{color:var(--neg)}
  .iconbtn.danger.armed{background:var(--negBg)}
  .iconbtn:active{opacity:.55}
  .settings-scope{gap:10px}
  .setgroup+.setgroup{margin-top:0}
  .setlabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink3);margin:0 0 6px 4px}
  .menuic{width:38px;height:38px;border-radius:12px;background:var(--group2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .menuic svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .credit{text-align:center;margin-top:26px;padding-bottom:4px}
  .credit-v{font-size:13px;color:var(--ink3);font-weight:500}
  .credit-m{font-size:13px;color:var(--ink2);margin-top:6px;font-weight:500}
  .credit-heart{color:#C0392B}
  .credit-m a{color:var(--pos);font-weight:700;text-decoration:none}
  .menurow{display:flex;align-items:center;gap:13px;width:100%;background:transparent;
    border:none;font-family:inherit;padding:14px 16px;cursor:pointer;text-align:left;position:relative}
  .menurow+.menurow::before{content:"";position:absolute;left:66px;right:0;top:0;height:.5px;background:var(--sep)}
  .menurow .isq{width:34px;height:34px;border-radius:11px}
  .menurow .isq svg{width:18px;height:18px}
  .menutxt{flex:1;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.2px}
  .menuchev{width:17px;height:17px;stroke:var(--ink3);fill:none;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .menurow:active{background:var(--group2)}
  .backbar{display:flex;align-items:center;gap:8px;background:transparent;border:none;
    font-family:inherit;padding:0 0 4px;cursor:pointer;color:var(--brand);
    font-size:15px;font-weight:700;letter-spacing:-0.3px}
  .backbar svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round}

<script>
/* =========================================================
   Mess Ledger — standalone. All data lives in this device's
   browser storage. No server, no account, works offline.
   ========================================================= */
var KEY = "mess-ledger-data-v1";

/* ================= team sync (Supabase) =================
   Uses its own localStorage key and its own row in the ledger table,
   so it can share a Supabase project with any other app without touching it. */
var CLOUD_KEY = "messLedger.cloud";
var guestMode = false, deputyMode = false, deputyToken = "", deputyRevoked = false;
// true while the floating + is showing the Add-entry view, so the
// Transactions tab is not highlighted at the same time
var fabActive = false;
var teamCfg = null, cloudUpdated = null, applyingRemote = false, pushing = false, pushTimer = null, lastCloudError = "";

function b64encode(str){
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64decode(str){
  str = str.replace(/-/g,"+").replace(/_/g,"/");
  while(str.length % 4) str += "=";
  return decodeURIComponent(escape(atob(str)));
}
function normaliseUrl(u){
  u = (u||"").trim();
  if(!u) return "";
  if(!/^https?:\/\//i.test(u)) u = "https://" + u;
  try{ return new URL(u).origin; }
  catch(e){ return u.replace(/\/+$/,"").replace(/\/rest\/v1.*$/i,""); }
}
/* ===========================================================================
   CONNECTION  -  fill these in before you deploy for your mess members.
   Leave them blank and the app works as a private copy on one device only.

   The "anon" key is PUBLIC by design: anyone can read it in the page source.
   That is safe ONLY because the database rules (supabase-lock.sql) let the
   public READ and nothing else - changing data needs the admin sign-in.
   NEVER paste the "service_role" key here.
   =========================================================================== */
var APP_CONFIG = {
  supabaseUrl: "https://iqptxfgkrzecvrfzupsk.supabase.co",   // e.g. https://abcdefghijklmnop.supabase.co
  anonKey:     "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxcHR4ZmdrcnplY3ZyZnp1cHNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODMyMDYsImV4cCI6MjEwMTc1OTIwNn0.dNuwMWuHi9mg3YLD0zzCH4IqntkZUPawqtEajpzu9fE",   // Supabase > Project Settings > API > "anon public"
  row:         "mess"
};
var DEFAULT_CLOUD = { url: APP_CONFIG.supabaseUrl, readKey: APP_CONFIG.anonKey, id: APP_CONFIG.row };
function cloudCfg(){
  try{
    var c = JSON.parse(localStorage.getItem(CLOUD_KEY));
    if(c) return c;
  }catch(e){}
  return DEFAULT_CLOUD.url ? Object.assign({}, DEFAULT_CLOUD) : null;
}
function saveCloudCfg(c){ try{ localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); return true; }catch(e){ return false; } }
function jwtRole(k){
  try{
    var p=String(k||"").split(".")[1]; if(!p) return "";
    p=p.replace(/-/g,"+").replace(/_/g,"/"); while(p.length%4) p+="=";
    return JSON.parse(atob(p)).role||"";
  }catch(e){ return ""; }
}
// the secret service_role key must never be used by the app
function keyIsSafe(k){ return jwtRole(k)!=="service_role"; }
function cloudReady(){ var c=cloudCfg(); return !!(c&&c.url&&c.readKey&&c.id&&keyIsSafe(c.readKey)); }
function cloudRow(cfg){ return normaliseUrl(cfg.url)+"/rest/v1/ledger?id=eq."+encodeURIComponent(cfg.id); }
function realOrigin(){
  if(location.protocol!=="http:" && location.protocol!=="https:") return null;
  if(!location.origin || location.origin==="null") return null;
  return location.origin + location.pathname;
}

function cloudPayload(){
  return {
    v:1,
    members: state.members,
    transactions: state.transactions,
    meals: state.meals,
    cooks: state.cooks,
    messName: state.messName || "",
    inventoryValue: state.inventoryValue,
    inventoryEnabled: state.inventoryEnabled,
    currency: state.currency,
    perms: state.perms,
    deputyPerms: state.deputyPerms,
    updated: new Date().toISOString()
  };
}
function applyCloud(d){
  state.members = d.members || [];
  state.transactions = d.transactions || [];
  state.meals = d.meals || [];
  state.cooks = d.cooks || [];
  if(typeof d.messName === "string") state.messName = d.messName;
  state.inventoryValue = Number(d.inventoryValue)||0;
  state.inventoryEnabled = !!d.inventoryEnabled;
  if(d.currency) state.currency = d.currency;
  if(d.perms) state.perms = Object.assign({summary:true,meals:true,money:true,members:true}, d.perms);
  if(d.deputyPerms) state.deputyPerms = Object.assign(state.deputyPerms, d.deputyPerms);
  cloudUpdated = d.updated || null;
  if(deputyMode) verifyDeputy();
}
function verifyDeputy(){
  if(!deputyMode) return;
  var dp = state.deputyPerms || {};
  if(!dp.enabled || (dp.token && deputyToken && dp.token !== deputyToken)){
    deputyMode = false; guestMode = true; deputyRevoked = true;
  }
}

function schedulePush(){
  if(guestMode || applyingRemote || !cloudReady()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){ pushCloud(true); }, 1200);
}
/* ---------- Admin sign-in (Supabase Auth) ---------- */
var ADMIN_KEY = "mess-admin-session";
var adminSession = null;     // {access, refresh, exp, email} once signed in
var syncReady = false;       // an admin device may only push AFTER one good pull
function loadAdmin(){
  try{ var a=JSON.parse(localStorage.getItem(ADMIN_KEY)); if(a&&a.refresh) adminSession=a; }catch(e){}
}
function saveAdmin(){
  try{ if(adminSession) localStorage.setItem(ADMIN_KEY, JSON.stringify(adminSession));
       else localStorage.removeItem(ADMIN_KEY); }catch(e){}
}
function authCall(path, body){
  var c=cloudCfg();
  return fetch(normaliseUrl(c.url)+"/auth/v1/"+path, {
    method:"POST", headers:{apikey:c.readKey,"Content-Type":"application/json"}, body:JSON.stringify(body)
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok,status:r.status,j:j}; });
  });
}
function takeSession(j){
  adminSession = {
    access:j.access_token, refresh:j.refresh_token,
    exp:Date.now()+(Number(j.expires_in)||3600)*1000,
    email:(j.user&&j.user.email)||(adminSession&&adminSession.email)||""
  };
  saveAdmin();
}
function adminLogin(email, password){
  if(!cloudReady()) return Promise.reject(new Error("No database is connected."));
  return authCall("token?grant_type=password",{email:email,password:password}).then(function(res){
    if(!res.ok||!res.j.access_token)
      throw new Error(res.j.error_description||res.j.msg||res.j.message||"Sign-in failed");
    takeSession(res.j); return true;
  });
}
function refreshAdmin(){
  if(!adminSession||!adminSession.refresh) return Promise.resolve(false);
  return authCall("token?grant_type=refresh_token",{refresh_token:adminSession.refresh}).then(function(res){
    if(res.ok&&res.j.access_token){ takeSession(res.j); return true; }
    // the server said no (revoked / expired): this device is no longer signed in
    if(res.status>=400&&res.status<500){ adminSession=null; saveAdmin(); applyRole(); render(); }
    return false;
  }).catch(function(){ return false; });          // offline: keep the session, try again later
}
function adminToken(){
  if(!adminSession) return Promise.resolve(null);
  if(adminSession.exp-Date.now()>60000) return Promise.resolve(adminSession.access);
  return refreshAdmin().then(function(ok){ return (ok&&adminSession)?adminSession.access:null; });
}
// Who is this device?  Signed-in admin = can edit.  Everyone else = read-only.
// With no database connected at all it is a private local copy, so it can edit.
function applyRole(){
  deputyMode=false;
  if(cloudReady()&&!adminSession){
    guestMode=true; var c=cloudCfg();
    teamCfg={url:normaliseUrl(c.url),readKey:c.readKey,id:c.id};
  } else { guestMode=false; teamCfg=null; }
}
function adminSignOut(){
  adminSession=null; saveAdmin(); syncReady=false; window.__dbOpen=false;
  applyRole(); tab="summary"; window.__setPage=null;
  render(); refreshTeam(false); fetchCookReqs();
}
// Try to write as an ordinary visitor. If that works, the database is open.
function securityCheck(cfg){
  cfg=cfg||cloudCfg();
  if(!cfg||!cfg.url||!cfg.readKey) return Promise.resolve("unknown");
  return fetch(cloudRow(cfg)+"&select=id",{
    method:"PATCH",
    headers:{apikey:cfg.readKey,Authorization:"Bearer "+cfg.readKey,
             "Content-Type":"application/json",Prefer:"return=representation"},
    body:JSON.stringify({id:cfg.id})
  }).then(function(r){
    return r.text().then(function(txt){
      var rows=null; try{ rows=JSON.parse(txt); }catch(e){}
      if(r.ok&&Array.isArray(rows)) return rows.length>0?"open":"locked";
      if(r.status===401||r.status===403)
        return /42501|permission denied|row-level security/i.test(txt)?"locked":"unknown";
      return "unknown";
    });
  }).catch(function(){ return "unknown"; });
}
function runSecurityCheck(){
  var el=document.getElementById("secResult");
  if(el){ el.textContent=t("secChecking"); el.style.color="var(--ink3)"; }
  securityCheck().then(function(r){
    window.__dbOpen=(r==="open"); renderBanner();
    var e2=document.getElementById("secResult"); if(!e2) return;
    e2.textContent=r==="open"?t("secOpen"):(r==="locked"?t("secOk"):t("secUnknown"));
    e2.style.color=r==="open"?"var(--neg)":(r==="locked"?"var(--pos)":"var(--ink3)");
  });
}
function autoSecurityCheck(){
  if(!adminSession||!cloudReady()) return;
  securityCheck().then(function(r){ window.__dbOpen=(r==="open"); renderBanner(); });
}
function openAdminLogin(){
  var box='width:100%;background:var(--fill);border:none;border-radius:12px;padding:12px 13px;font-size:16px;color:var(--ink);margin-bottom:8px';
  openDialog(t("signInAdmin"),
    '<p class="hint" style="margin:0 0 12px">'+esc(t("adminLoginHint"))+'</p>'+
    '<input type="email" id="admEmail" autocomplete="username" inputmode="email" autocapitalize="none" '+
      'autocorrect="off" placeholder="'+esc(t("email"))+'" style="'+box+'">'+
    '<input type="password" id="admPass" autocomplete="current-password" placeholder="'+esc(t("password"))+'" style="'+box+'">'+
    '<p id="admErr" style="font-size:12.5px;font-weight:700;min-height:18px;margin:4px 0 8px;color:var(--neg)"></p>'+
    '<button class="btn primary" id="admGo" style="width:100%">'+esc(t("signIn"))+'</button>');
  var go=document.getElementById("admGo"), err=document.getElementById("admErr");
  function submit(){
    var em=document.getElementById("admEmail").value.trim(), pw=document.getElementById("admPass").value;
    if(!em||!pw){ err.textContent=t("fillBoth"); return; }
    err.style.color="var(--ink3)"; err.textContent=t("signingIn"); go.disabled=true;
    adminLogin(em,pw).then(function(){
      var o=document.getElementById("teamOverlay"); if(o) o.style.display="none";
      applyRole(); render(); toastMsg(t("signedInOk"));
      pullIfNewer(false).then(function(){ render(); autoSecurityCheck(); });
      fetchCookReqs();
    }).catch(function(e){
      go.disabled=false; err.style.color="var(--neg)"; err.textContent=(e&&e.message)||"Sign-in failed";
    });
  }
  go.addEventListener("click",submit);
  document.getElementById("admPass").addEventListener("keydown",function(ev){ if(ev.key==="Enter") submit(); });
  setTimeout(function(){ var i=document.getElementById("admEmail"); if(i) i.focus(); },50);
}

function pushCloud(silent){
  if(guestMode||!cloudReady()||pushing) return Promise.resolve(false);
  if(!syncReady){ setSyncNote("Waiting for the first sync\u2026"); return Promise.resolve(false); }
  var cfg=cloudCfg(); pushing=true; setSyncNote("Sending\u2026");
  return adminToken().then(function(tok){
    if(!tok) throw new Error("Please sign in again");
    return fetch(cloudRow(cfg)+"&select=id",{
      method:"PATCH",
      headers:{apikey:cfg.readKey,Authorization:"Bearer "+tok,
               "Content-Type":"application/json",Prefer:"return=representation"},
      body:JSON.stringify({data:cloudPayload()})
    });
  }).then(function(r){
    if(!r.ok) return r.text().then(function(b){ throw new Error("HTTP "+r.status+(b?" \u2014 "+b.slice(0,200):"")); });
    return r.json();
  }).then(function(rows){
    // when its rules refuse a write the database answers "0 rows changed" - NOT an error
    if(!rows||!rows.length) throw new Error("The database refused this change. Is this account the admin named in supabase-lock.sql?");
    pushing=false; cfg.lastPush=new Date().toISOString(); saveCloudCfg(cfg);
    setSyncNote("Team copy updated "+new Date().toLocaleTimeString());
    if(!silent) toastMsg("Everyone can see it now");
    return true;
  }).catch(function(e){
    pushing=false; lastCloudError=e.message||String(e);
    setSyncNote("Not saved to the database: "+lastCloudError);
    toastMsg("Not saved \u2014 "+lastCloudError.slice(0,60));
    return false;
  });
}
function pullCloud(cfg){
  return fetch(cloudRow(cfg)+"&select=data", {headers:{apikey:cfg.readKey, Authorization:"Bearer "+cfg.readKey}})
    .then(function(r){
      if(!r.ok) return r.text().then(function(b){ throw new Error("HTTP "+r.status+(b?" \u2014 "+b.slice(0,200):"")); });
      return r.json();
    }).then(function(rows){
      if(!rows||!rows.length||!rows[0].data) throw new Error("nothing stored yet");
      return rows[0].data;
    });
}
function pullIfNewer(announce){
  if(guestMode||!cloudReady()||pushing) return Promise.resolve(false);
  var cfg=cloudCfg();
  return pullCloud({url:cfg.url,readKey:cfg.readKey,id:cfg.id}).then(function(d){
    syncReady=true;                         // we have now seen what is really stored
    if(!d||!d.updated) return false;
    var theirs=new Date(d.updated).getTime(), ours=cfg.lastPush?new Date(cfg.lastPush).getTime():0;
    if(theirs<=ours+1500) return false;
    applyingRemote=true;
    applyCloud(d);
    try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
    cfg.lastPush=d.updated; saveCloudCfg(cfg);
    applyingRemote=false;
    render();
    setSyncNote("Picked up changes made elsewhere at "+new Date(d.updated).toLocaleString());
    if(announce) toastMsg("Updated \u2014 someone else made changes");
    return true;
  }).catch(function(){ return false; });
}
function refreshTeam(first){
  if(!teamCfg) return;
  if(deputyMode && pushing) return;
  pullCloud(teamCfg).then(function(d){ applyCloud(d); render(); })
    .catch(function(){ render(); });
}
function setSyncNote(msg){ var el=document.getElementById("syncNote"); if(el) el.textContent=msg; }
function toastMsg(msg){
  var el=document.getElementById("saveStatus");
  if(!el) return;
  el.textContent=msg; el.style.color="var(--brand)";
  clearTimeout(statusTimer);
  statusTimer=setTimeout(function(){ el.innerHTML="&nbsp;"; },2200);
}

// The member link is simply this page's address; being read-only is the default.
function memberLink(){ return realOrigin() || (location.href.split("#")[0]); }
function deputyLink(){ return memberLink(); }
function deputyMay(what){ return false; }
function canWrite(){
  if(!cloudReady()) return true;         // private copy on this device
  return !!adminSession;                 // otherwise: only a signed-in admin
}

function parseAmt(v){
  if(v==null) return NaN;
  // Accept "10.25" and "10,25"; strip spaces and stray currency symbols.
  var s=String(v).trim().replace(/[\s\u00A0\u20AC]/g,"").replace(",",".");
  if(s==="") return NaN;
  return Number(s);
}
function money(n){
  var v=Math.round((n+Number.EPSILON)*100)/100;
  var sign=v<0?"\u2212":"";
  var cur=CURRENCIES[state.currency]||CURRENCIES.EUR;
  // whole amounts stay clean; anything with a fraction shows both places
  var frac = Math.abs(v)%1 !== 0;
  var num=Math.abs(v).toLocaleString("en-US",
    {minimumFractionDigits:frac?2:0, maximumFractionDigits:2});
  return cur.before ? (sign+cur.symbol+num) : (sign+num+" "+cur.symbol);
}
function esc(s){

    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ---------- calculations ---------- */
function monthMetrics(mk){
  var tx = state.transactions.filter(function(x){return mKey(x.date)===mk;});
  var ml = state.meals.filter(function(x){return mKey(x.date)===mk;});
  var totalExpense = tx.filter(function(x){return x.type==="expense"||x.type==="payable";})
    .reduce(function(s,x){return s+Number(x.amount);},0);
  var totalMeals = ml.reduce(function(s,x){return s+Number(x.count);},0);

  // Members who left during this month have their bill locked at the
  // meal rate as it stood on their last day. Anything bought after that
  // is shared only by the people still eating.
  var lockedRate = {}, lockedCost = 0, lockedMeals = 0;
  // The normal month rate, as if nobody had left.
  var plainRate = totalMeals>0 ? totalExpense/totalMeals : 0;
  state.members.forEach(function(m){
    if(!m.leftOn || mKey(m.leftOn)!==mk) return;
    var expUpTo = tx.filter(function(x){
        if(x.type!=="expense" && x.type!=="payable") return false;
        if(x.date < m.leftOn) return true;
        if(x.date > m.leftOn) return false;
        // Same day he left: only what was recorded before he left.
        // Entries without a timestamp predate this feature, so they count.
        if(!m.leftAt || !x.createdAt) return true;
        return x.createdAt <= m.leftAt;
      })
      .reduce(function(s,x){return s+Number(x.amount);},0);
    var mealsUpTo = ml.filter(function(x){return x.date<=m.leftOn;})
      .reduce(function(s,x){return s+Number(x.count);},0);
    var r = mealsUpTo>0 ? expUpTo/mealsUpTo : 0;
    // Never charge a leaver more per meal than the month's normal rate.
    // Otherwise he pays for stock that was bought before he left but
    // eaten by the others afterwards.
    if(plainRate>0 && plainRate<r) r = plainRate;
    var his = ml.filter(function(x){return x.memberId===m.id;})
      .reduce(function(s,x){return s+Number(x.count);},0);
    lockedRate[m.id] = r;
    lockedCost += his*r;
    lockedMeals += his;
  });
  var restMeals = totalMeals - lockedMeals;
  var rate = restMeals>0 ? (totalExpense-lockedCost)/restMeals
           : (totalMeals>0 ? totalExpense/totalMeals : 0);

  var rows = state.members.map(function(m){
    var c = tx.filter(function(x){return x.type==="contribution"&&x.memberId===m.id;})
      .reduce(function(s,x){return s+Number(x.amount);},0);
    var e = tx.filter(function(x){return x.type==="expense"&&x.memberId===m.id;})
      .reduce(function(s,x){return s+Number(x.amount);},0);
    var w = tx.filter(function(x){return x.type==="withdrawal"&&x.memberId===m.id;})
      .reduce(function(s,x){return s+Number(x.amount);},0);
    var mc = ml.filter(function(x){return x.memberId===m.id;})
      .reduce(function(s,x){return s+Number(x.count);},0);
    var isLocked = lockedRate.hasOwnProperty(m.id);
    var myRate = isLocked ? lockedRate[m.id] : rate;
    var cost = mc*myRate, paid = c+e-w;
    return {memberId:m.id,contribution:c,expense:e,withdrawal:w,totalPaid:paid,
      mealCount:mc,mealCost:cost,monthBalance:paid-cost,
      locked:isLocked, memberRate:myRate};
  });
  return {rows:rows,rate:rate,totalMeals:totalMeals,totalExpense:totalExpense,tx:tx};
}
function summary(){
  var dates = state.transactions.map(function(x){return x.date;})
    .concat(state.meals.map(function(x){return x.date;}));
  var months = {};
  dates.forEach(function(d){ months[mKey(d)]=1; });
  var prior = Object.keys(months).sort().filter(function(k){return k<month;});
  var opening = {};
  state.members.forEach(function(m){opening[m.id]=0;});
  prior.forEach(function(mk){
    monthMetrics(mk).rows.forEach(function(r){
      opening[r.memberId]=(opening[r.memberId]||0)+r.monthBalance;
    });
  });
  var cur = monthMetrics(month);
  var activeIds = {};
  state.members.forEach(function(m){
    if(m.active!==false || (m.leftOn && mKey(m.leftOn)>=month)) activeIds[m.id]=1;
  });
  var rows = cur.rows.filter(function(r){return activeIds[r.memberId];}).map(function(r){
    var mem = state.members.filter(function(m){return m.id===r.memberId;})[0];
    var op = opening[r.memberId]||0;
    var out = {};
    for(var k in r) out[k]=r[k];
    out.member=mem; out.opening=op; out.closing=op+r.monthBalance;
    return out;
  });
  var tot = rows.reduce(function(a,r){
    return {contribution:a.contribution+r.contribution, expense:a.expense+r.expense,
      withdrawal:a.withdrawal+r.withdrawal, totalPaid:a.totalPaid+r.totalPaid,
      mealCount:a.mealCount+r.mealCount, mealCost:a.mealCost+r.mealCost,
      opening:a.opening+r.opening, monthBalance:a.monthBalance+r.monthBalance,
      closing:a.closing+r.closing};
  },{contribution:0,expense:0,withdrawal:0,totalPaid:0,mealCount:0,mealCost:0,
     opening:0,monthBalance:0,closing:0});
  return {rows:rows,rate:cur.rate,totalMeals:cur.totalMeals,
    totalExpense:cur.totalExpense,totals:tot,tx:cur.tx};
}
function cashBalance(){
  var c = state.transactions.filter(function(x){return x.type==="contribution";})
    .reduce(function(s,x){return s+Number(x.amount);},0);
  var e = state.transactions.filter(function(x){return x.type==="expense"&&!x.memberId;})
    .reduce(function(s,x){return s+Number(x.amount);},0);
  var w = state.transactions.filter(function(x){return x.type==="withdrawal";})
    .reduce(function(s,x){return s+Number(x.amount);},0);
  var pp = state.transactions.filter(function(x){return x.type==="payable_payment";})
    .reduce(function(s,x){return s+Number(x.amount);},0);
  return c-e-w-pp;
}
// What the mess currently owes shops/vendors, by name — a payable adds to
// what's owed; paying it off (payable_payment) reduces it. Only entries with
// a positive outstanding balance are returned.
function computeShopPayables(){
  var owed={};
  state.transactions.forEach(function(x){
    if(x.type==="payable"){ var v=x.vendor||"?"; owed[v]=(owed[v]||0)+Number(x.amount); }
    else if(x.type==="payable_payment"){ var v2=x.vendor||"?"; owed[v2]=(owed[v2]||0)-Number(x.amount); }
  });
  return Object.keys(owed).map(function(v){ return {vendor:v, owed:owed[v]}; })
    .filter(function(r){ return Math.abs(r.owed)>0.01; })
    .sort(function(a,b){ return b.owed-a.owed; });
}
function totalOwedToShops(){
  return computeShopPayables().reduce(function(s,r){ return s+Math.max(0,r.owed); },0);
}

// ---- Cook requests -----------------------------------------------------
var cookReqs    = [];        // pending/decided requests fetched from the db

function reqHeaders(extra){
  var c=cloudCfg()||{}, h={apikey:c.readKey, Authorization:"Bearer "+c.readKey,
    "Content-Type":"application/json"};
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
// keep the members table in step so the database can verify a request
function fetchCookReqs(){
  var c=cloudCfg(); if(!c||!c.url) return Promise.resolve();
  return fetch(normaliseUrl(c.url)+"/rest/v1/cook_requests?select=*&order=cook_date.asc",
    {headers:reqHeaders()})
    .then(function(r){
      if(!r.ok){ window.__reqErr = "HTTP "+r.status; return []; }
      window.__reqErr = null; return r.json();
    })
    .then(function(rows){ cookReqs=rows||[]; render(); })
    .catch(function(e){ window.__reqErr = (e&&e.message)||"network"; });
}
function sendCookReq(dateStr, note, whoId){
  var c=cloudCfg(); if(!c||!c.url) return Promise.resolve(false);
  var m=state.members.filter(function(x){ return x.id===whoId; })[0];
  if(!m) return Promise.resolve(false);
  return fetch(normaliseUrl(c.url)+"/rest/v1/cook_requests",
    {method:"POST", headers:reqHeaders({Prefer:"return=minimal"}),
     body:JSON.stringify({member_id:m.id, member_name:m.name,
       cook_date:dateStr, note:note||null, status:"pending"})})
    .then(function(r){ return r.ok; }).catch(function(){ return false; });
}
function decideCookReq(id, ok, dateStr, who){
  var c=cloudCfg(); if(!c||!c.url) return Promise.resolve(false);
  return adminToken().then(function(tok){
    if(!tok) return false;
    return fetch(normaliseUrl(c.url)+"/rest/v1/cook_requests?id=eq."+id+"&select=id",
      {method:"PATCH",
       headers:{apikey:c.readKey,Authorization:"Bearer "+tok,
                "Content-Type":"application/json",Prefer:"return=representation"},
       body:JSON.stringify({status: ok?"approved":"declined"})})
      .then(function(r){ return r.ok?r.json():[]; })
      .then(function(rows){
        var done=!!(rows&&rows.length);          // 0 rows = the database refused it
        if(done&&ok){
          var m=state.members.filter(function(x){ return x.name===who||x.id===who; })[0];
          if(m){ setCook(dateStr,m.id); save(); }
        }
        return done;
      });
  }).catch(function(){ return false; });
}
function pendingReqs(){
  var today=todayISO();
  // a request for a day that has already gone can no longer be acted on
  return cookReqs.filter(function(r){ return r.status==="pending" && r.cook_date>today; });
}

// ---- Cooking rotation -------------------------------------------------
// Who is in the circle: current members who have not opted out.
function cookCircle(){
  return state.members.filter(function(m){ return m.active!==false && m.cooks!==false; });
}
function cookOn(date){
  var e = state.cooks.filter(function(c){ return c.date===date; })[0];
  return e ? e.memberId : null;
}
function cookedSoFar(mk){
  var out={}, today=todayISO();
  state.cooks.forEach(function(c){
    if(mKey(c.date)===mk && c.date<=today) out[c.memberId]=(out[c.memberId]||0)+1;
  });
  return out;
}
// counts every booking, including future ones — the rotation needs these
// so it never books the same person twice ahead of time
function cookCounts(mk){
  var out={};
  state.cooks.forEach(function(c){ if(mKey(c.date)===mk) out[c.memberId]=(out[c.memberId]||0)+1; });
  return out;
}
function lastCookDate(id, before){
  var last=null;
  state.cooks.forEach(function(c){
    if(c.memberId!==id) return;
    if(before && c.date>=before) return;
    if(!last || c.date>last) last=c.date;
  });
  return last;
}
// Next turn: fewest turns this month, then whoever cooked longest ago,
// then roster order — so the circle stays even.
function suggestCook(date){
  var circle=cookCircle(); if(!circle.length) return null;
  var counts=cookCounts(mKey(date));
  var best=null, bestKey=null;
  circle.forEach(function(m,i){
    var key=[counts[m.id]||0, lastCookDate(m.id,date)||"", i];
    if(!best || key[0]<bestKey[0] ||
      (key[0]===bestKey[0] && key[1]<bestKey[1]) ||
      (key[0]===bestKey[0] && key[1]===bestKey[1] && key[2]<bestKey[2])){ best=m; bestKey=key; }
  });
  return best;
}

var googleAccessToken=null, googleTokenExpiry=0, gisTokenClient=null, googleNeedsReconnect=false;
var sheetPushBusy=false, sheetPushDirty=false;

function persistLocalOnly(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

function ensureTokenClient(){
  if(!window.google || !google.accounts || !google.accounts.oauth2) return null;
  if(!gisTokenClient || gisTokenClient.__cid !== state.googleClientId){
    gisTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: state.googleClientId,
      scope: "https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file",
      callback: onGoogleToken
    });
    gisTokenClient.__cid = state.googleClientId;
  }
  return gisTokenClient;
}
function onGoogleToken(resp){
  if(resp && resp.access_token){
    googleAccessToken = resp.access_token;
    googleTokenExpiry = Date.now() + (Number(resp.expires_in||3500)*1000);
    state.googleConnected = true;
    googleNeedsReconnect = false;
    persistLocalOnly();
    pushToSheet();
    render();
  } else {
    state.googleConnected = false;
    persistLocalOnly();
    render();
  }
}
function connectGoogle(){
  if(!state.googleClientId){ return; }
  googleNeedsReconnect = false;
  var tc = ensureTokenClient();
  if(tc) tc.requestAccessToken({prompt:"consent"});
}
function disconnectGoogle(){
  googleAccessToken=null; googleTokenExpiry=0;
  state.googleConnected=false; state.googleSheetId=null;
  persistLocalOnly(); render();
}
function ensureSheet(done){
  if(state.googleSheetId){ done && done(); return; }
  fetch("https://sheets.googleapis.com/v4/spreadsheets", {
    method:"POST",
    headers:{"Authorization":"Bearer "+googleAccessToken,"Content-Type":"application/json"},
    body: JSON.stringify({
      properties:{title:"Mess Ledger Backup"},
      sheets:[{properties:{title:"Summary"}},{properties:{title:"Balances"}},
              {properties:{title:"Shops"}},{properties:{title:"Members"}},
              {properties:{title:"Transactions"}},{properties:{title:"Meals"}}]
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data && data.spreadsheetId){
      state.googleSheetId = data.spreadsheetId;
      persistLocalOnly();
    }
    done && done();
  }).catch(function(){ done && done(); });
}
function computeMemberBalances(mk){
  mk = mk || month;
  var dates = state.transactions.map(function(x){return x.date;}).concat(state.meals.map(function(x){return x.date;}));
  var months={}; dates.forEach(function(d){ months[mKey(d)]=1; });
  var prior = Object.keys(months).sort().filter(function(k){return k<mk;});
  var opening={}; state.members.forEach(function(m){ opening[m.id]=0; });
  prior.forEach(function(pmk){
    monthMetrics(pmk).rows.forEach(function(r){ opening[r.memberId]=(opening[r.memberId]||0)+r.monthBalance; });
  });
  var cur = monthMetrics(mk);
  return state.members.map(function(m){
    var totalContribution = state.transactions.filter(function(x){return x.type==="contribution"&&x.memberId===m.id;})
      .reduce(function(s,x){return s+Number(x.amount);},0);
    var totalExpense = state.transactions.filter(function(x){return x.type==="expense"&&x.memberId===m.id;})
      .reduce(function(s,x){return s+Number(x.amount);},0);
    var totalWithdrawal = state.transactions.filter(function(x){return x.type==="withdrawal"&&x.memberId===m.id;})
      .reduce(function(s,x){return s+Number(x.amount);},0);
    var curRow = cur.rows.filter(function(r){return r.memberId===m.id;})[0];
    var closing = (opening[m.id]||0) + (curRow?curRow.monthBalance:0);
    return {name:m.name, active:m.active!==false, totalContribution:totalContribution,
      totalExpense:totalExpense, totalWithdrawal:totalWithdrawal, closing:closing};
  });
}
function buildSheetPayload(){
  var mrows=[["ID","Name","Active"]];
  state.members.forEach(function(m){ mrows.push([m.id, m.name, m.active===false?"No":"Yes"]); });

  var trows=[["ID","Date","Type","Member","Amount","Note"]];
  state.transactions.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(x){
    var mem=state.members.filter(function(m){return m.id===x.memberId;})[0];
    trows.push([x.id, x.date, x.type, mem?mem.name:"Mess", Number(x.amount), x.note||""]);
  });

  var lrows=[["ID","Date","Member","Count"]];
  state.meals.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(x){
    var mem=state.members.filter(function(m){return m.id===x.memberId;})[0];
    lrows.push([x.id, x.date, mem?mem.name:"?", Number(x.count)]);
  });

  var cb=cashBalance();
  var inv=state.inventoryEnabled?(Number(state.inventoryValue)||0):0;
  var curMk = month;
  var curM = monthMetrics(curMk);
  var srows=[["Field","Value"],
    ["Generated", new Date().toISOString()],
    ["Cash balance", cb],
    ["Inventory value", inv],
    ["Present balance", cb+inv],
    ["Currency", state.currency],
    ["Total mess expense ("+monthLabel(curMk)+")", curM.totalExpense],
    ["Total meals ("+monthLabel(curMk)+")", curM.totalMeals],
    ["Meal rate ("+monthLabel(curMk)+")", curM.rate ? Number(curM.rate.toFixed(4)) : 0]];

  var brows=[["Member","Status","Total Contribution","Total Expense","Total Withdrawal","Due / Advance","Label"]];
  computeMemberBalances().forEach(function(b){
    brows.push([b.name, b.active?"Active":"Inactive", b.totalContribution, b.totalExpense,
      b.totalWithdrawal, b.closing, b.closing<-0.01?"Due":(b.closing>0.01?"Advance":"Settled")]);
  });

  var shrows=[["Shop / Vendor","Owed"]];
  computeShopPayables().forEach(function(r){ shrows.push([r.vendor, r.owed]); });

  return [
    {range:"Summary!A1", values:srows},
    {range:"Balances!A1", values:brows},
    {range:"Shops!A1", values:shrows},
    {range:"Members!A1", values:mrows},
    {range:"Transactions!A1", values:trows},
    {range:"Meals!A1", values:lrows}
  ];
}
function pushToSheet(){
  if(!state.googleConnected) return;
  if(sheetPushBusy){ sheetPushDirty=true; return; }
  if(!googleAccessToken || Date.now() > googleTokenExpiry-5000){
    // Silent refresh is unreliable inside a home-screen web app on iOS,
    // so rather than fail invisibly, ask for a manual reconnect.
    googleNeedsReconnect = true;
    if(tab==="settings") render();
    return;
  }
  if(!state.googleSheetId){ ensureSheet(pushToSheet); return; }
  sheetPushBusy=true;
  var sheetNames=["Summary","Balances","Shops","Members","Transactions","Meals"];
  fetch("https://sheets.googleapis.com/v4/spreadsheets/"+state.googleSheetId+"/values:batchClear",{
    method:"POST",
    headers:{"Authorization":"Bearer "+googleAccessToken,"Content-Type":"application/json"},
    body: JSON.stringify({ranges: sheetNames})
  }).then(function(){
    return fetch("https://sheets.googleapis.com/v4/spreadsheets/"+state.googleSheetId+"/values:batchUpdate",{
      method:"POST",
      headers:{"Authorization":"Bearer "+googleAccessToken,"Content-Type":"application/json"},
      body: JSON.stringify({valueInputOption:"RAW", data: buildSheetPayload()})
    });
  }).then(function(r){
    sheetPushBusy=false;
    if(r.ok){
      state.lastSheetSync=new Date().toISOString();
      persistLocalOnly();
      if(document.getElementById("view") && tab==="settings") render();
      if(sheetPushDirty){ sheetPushDirty=false; pushToSheet(); }
    }
  }).catch(function(){
    sheetPushBusy=false;
  });
}

function cookDatesRow(id){
  var today=todayISO();
  var all=state.cooks.filter(function(c){ return c.memberId===id && mKey(c.date)===month; })
    .map(function(c){ return c.date; }).sort();
  var done=all.filter(function(k){ return k<=today; }), next=all.filter(function(k){ return k>today; });
  function tag(k,cls){ var d=new Date(k+"T00:00:00");
    return '<span class="cdate'+(cls||"")+'">'+esc(d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}))+'</span>'; }
  if(!all.length) return '<div class="cdates"><span class="hint" style="margin:0">'+esc(t("noCooking"))+'</span></div>';
  return '<div class="cdates">'+
    (done.length?done.map(function(k){return tag(k);}).join(""):'<span class="hint" style="margin:0">'+esc(t("noCooking"))+'</span>')+
    (next.length?'<span class="cnext">'+esc(t("upcomingShort"))+'</span>'+next.map(function(k){return tag(k," soon");}).join(""):'')+
    '</div>';
}

    });

       esc(t("seeAllTx"))+'</button></div>';

  if(view==="list"){

  if(shopRows.length){
    h+='<div><h2>'+esc(t("owedToShops"))+'</h2>';
    shopRows.forEach(function(r){
      h+='<div class="pillrow"><span class="shopname">'+esc(r.vendor)+'</span>'+

    h+='<option value="'+m.id+'"'+(filt.member===m.id?" selected":"")+'>'+esc(m.name)+'</option>';
  });
  h+='</select><div style="display:flex;gap:6px">'+
     '<button class="chip '+(filt.scope==="month"?"on":"")+'" data-scope="month">'+esc(t("thisMonth"))+'</button>'+
     '<button class="chip '+(filt.scope==="all"?"on":"")+'" data-scope="all">'+esc(t("allTime"))+'</button></div></div>';

  h+='<div class="ftypes">'+
     [["all",t("allTypes")],["cash",t("contribShort")],["spent",t("expenseShort")]].map(function(o){

     }).join("")+'</div>';

  // a total, so a filtered list answers "how much?" straight away
  if((filt.type||"all")!=="all" && list.length){
    var ftot=list.reduce(function(acc,x){ return acc+Number(x.amount||0); },0);

var LOCK_SQL_TEMPLATE = "-- ============================================================================\n--  MESS LEDGER  -  lock the database\n--\n--  Supabase  >  SQL Editor  >  paste ALL of this  >  Run.\n--\n--  AFTER THIS:\n--    * everyone can READ the ledger and see cook requests\n--    * a member can SEND a cook request (and nothing else)\n--    * ONLY the admin e-mail you name below can change anything\n--\n--  EDIT THE ONE LINE MARKED  <<<<<  THEN RUN.   Safe to run more than once.\n-- ============================================================================\n\ndo $lock$\ndeclare\n  admin_email text := lower('__ADMIN_EMAIL__');   -- <<<<<  the e-mail you sign in with\n  pol record;\nbegin\n  if admin_email = lower('you@example.com') then\n    raise exception 'Stop: change you@example.com on the marked line to your real admin e-mail first.';\n  end if;\n\n  -- 1. the two tables (does nothing if they already exist)\n  create table if not exists public.ledger (\n    id   text primary key,\n    data jsonb\n  );\n  insert into public.ledger (id, data) values ('mess', '{}'::jsonb)\n    on conflict (id) do nothing;\n\n  create table if not exists public.cook_requests (\n    id          bigint generated always as identity primary key,\n    member_id   text not null,\n    member_name text not null,\n    cook_date   date not null,\n    note        text,\n    status      text not null default 'pending',\n    created_at  timestamptz not null default now()\n  );\n\n  alter table public.ledger        enable row level security;\n  alter table public.cook_requests enable row level security;\n\n  -- 2. delete EVERY old rule on these tables, including the open ones\n  for pol in\n    select policyname, tablename\n    from pg_policies\n    where schemaname = 'public' and tablename in ('ledger', 'cook_requests')\n  loop\n    execute format('drop policy %I on public.%I', pol.policyname, pol.tablename);\n  end loop;\n\n  -- 3. the public may only read. Remove their write permissions entirely,\n  --    so even a rule added by mistake later could not open the door.\n  revoke insert, update, delete on public.ledger        from anon;\n  revoke update, delete         on public.cook_requests from anon;\n\n  grant select                 on public.ledger        to anon, authenticated;\n  grant insert, update         on public.ledger        to authenticated;\n  grant select, insert         on public.cook_requests to anon, authenticated;\n  grant update, delete         on public.cook_requests to authenticated;\n\n  create policy \"everyone reads the ledger\"\n    on public.ledger for select to anon, authenticated using (true);\n\n  create policy \"everyone reads requests\"\n    on public.cook_requests for select to anon, authenticated using (true);\n\n  create policy \"members may add a pending request\"\n    on public.cook_requests for insert to anon, authenticated\n    with check (status = 'pending');\n\n  -- 4. only the admin changes things\n  execute format($f$\n    create policy \"admin updates the ledger\" on public.ledger for update to authenticated\n    using (lower(auth.jwt() ->> 'email') = %L)\n    with check (lower(auth.jwt() ->> 'email') = %L)$f$, admin_email, admin_email);\n\n  execute format($f$\n    create policy \"admin creates the ledger row\" on public.ledger for insert to authenticated\n    with check (lower(auth.jwt() ->> 'email') = %L)$f$, admin_email);\n\n  execute format($f$\n    create policy \"admin decides requests\" on public.cook_requests for update to authenticated\n    using (lower(auth.jwt() ->> 'email') = %L)\n    with check (lower(auth.jwt() ->> 'email') = %L)$f$, admin_email, admin_email);\n\n  execute format($f$\n    create policy \"admin deletes requests\" on public.cook_requests for delete to authenticated\n    using (lower(auth.jwt() ->> 'email') = %L)$f$, admin_email);\nend\n$lock$;\n";
function buildLockSql(email){
  var safe=String(email||"").trim().replace(/'/g,"''")||"you@example.com";
  return LOCK_SQL_TEMPLATE.split("__ADMIN_EMAIL__").join(safe);
}

function ensureOverlay(){
  var o = document.getElementById("teamOverlay");
  if(o) return o;
  o = document.createElement("div");
  o.id = "teamOverlay";
  o.style.cssText = "position:fixed;inset:0;background:rgba(10,10,20,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9999";
  o.addEventListener("click", function(e){ if(e.target===o) o.style.display="none"; });
  document.body.appendChild(o);
  return o;
}
function openDialog(title, inner){
  var o = ensureOverlay();
  o.style.display = "flex";
  o.innerHTML = '<div style="background:var(--group);border-radius:22px;padding:18px;width:100%;max-width:420px;max-height:86vh;overflow:auto;color:var(--ink)">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    + '<b style="font-size:15px">'+esc(title)+'</b>'
    + '<button class="btn" id="tmClose" style="padding:6px 12px">Close</button></div>'
    + inner + '</div>';
  document.getElementById("tmClose").addEventListener("click", function(){ o.style.display="none"; });
  return o;
}
function copyStr(str, ok){
  var ta=document.createElement("textarea");
  ta.value=str; ta.style.cssText="position:fixed;top:-1000px";
  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,str.length);
  var done=false; try{ done=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  if(done){ toastMsg(ok); return; }
  if(navigator.clipboard) navigator.clipboard.writeText(str).then(function(){ toastMsg(ok); });
}

function openCloudSetup(){
  var c=cloudCfg()||{};
  var box='width:100%;background:var(--fill);border:none;border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);margin-bottom:8px';
  openDialog(t("connectDbBtn"),
    '<p class="hint" style="margin:0 0 10px">'+esc(t("dlgHint"))+'</p>'+
    '<input id="mUrl" placeholder="https://xxxx.supabase.co" style="'+box+'" autocapitalize="none" autocomplete="off">'+
    '<input id="mRead" placeholder="anon public key" style="'+box+'" autocapitalize="none" autocomplete="off">'+
    '<input id="mId" placeholder="row name" style="'+box+'" autocapitalize="none" autocomplete="off">'+
    '<p id="mErr" style="font-size:12px;font-weight:700;white-space:pre-wrap;min-height:16px;margin:6px 0"></p>'+
    '<button class="btn primary" id="mSave" style="width:100%;margin-bottom:8px">'+esc(t("dlgSave"))+'</button>'+
    '<button class="btn" id="mTest" style="width:100%">'+esc(t("dlgTest"))+'</button>'+
    '<div style="border-top:1px solid var(--sep);margin:16px 0 12px"></div>'+
    '<b style="font-size:14px">'+esc(t("dlgLockTitle"))+'</b>'+
    '<p class="hint" style="margin:6px 0 8px">'+esc(t("dlgLockHint"))+'</p>'+
    '<input id="mAdminEmail" type="email" placeholder="admin@email.com" style="'+box+'" autocapitalize="none" autocomplete="off">'+
    '<textarea readonly id="mSql" style="'+box+';height:140px;font-family:monospace;font-size:11px"></textarea>'+
    '<button class="btn" id="mCopySql" style="width:100%">'+esc(t("dlgCopySql"))+'</button>');
  document.getElementById("mUrl").value=c.url||"";
  document.getElementById("mRead").value=c.readKey||"";
  document.getElementById("mId").value=c.id||"mess";
  function readForm(){
    return {url:normaliseUrl(document.getElementById("mUrl").value),
            readKey:document.getElementById("mRead").value.trim(),
            id:document.getElementById("mId").value.trim()||"mess"};
  }
  function refreshSql(){ document.getElementById("mSql").value=buildLockSql(document.getElementById("mAdminEmail").value); }
  document.getElementById("mAdminEmail").addEventListener("input",refreshSql); refreshSql();
  document.getElementById("mCopySql").addEventListener("click",function(){
    copyStr(buildLockSql(document.getElementById("mAdminEmail").value), t("copied")); });
  function check(f){
    var err=document.getElementById("mErr");
    if(!/^https:\/\/[^\/]+$/.test(f.url)){ err.style.color="var(--neg)"; err.textContent=t("dlgBadUrl"); return false; }
    if(!f.readKey){ err.style.color="var(--neg)"; err.textContent=t("dlgNeedKey"); return false; }
    if(!keyIsSafe(f.readKey)){ err.style.color="var(--neg)"; err.textContent=t("badKey"); return false; }
    return true;
  }
  document.getElementById("mTest").addEventListener("click",function(){
    var f=readForm(), err=document.getElementById("mErr");
    if(!check(f)) return;
    err.style.color="var(--ink3)"; err.textContent=t("secChecking");
    fetch(cloudRow(f)+"&select=id",{headers:{apikey:f.readKey,Authorization:"Bearer "+f.readKey}})
      .then(function(r){ return r.text().then(function(b){ return {s:r.status,b:b}; }); })
      .then(function(rd){
        var okRead=rd.s<300;
        return securityCheck(f).then(function(sec){
          err.style.color=(okRead&&sec==="locked")?"var(--pos)":"var(--neg)";
          err.textContent=(okRead?t("dlgReadOk"):("Read failed: HTTP "+rd.s+" "+rd.b.slice(0,100)))+"\n"+
            (sec==="locked"?t("secOk"):(sec==="open"?t("secOpen"):t("secUnknown")));
        });
      }).catch(function(e){ err.style.color="var(--neg)"; err.textContent="Network error: "+((e&&e.message)||e); });
  });
  document.getElementById("mSave").addEventListener("click",function(){
    var f=readForm(); if(!check(f)) return;
    saveCloudCfg(f);
    var o=document.getElementById("teamOverlay"); if(o) o.style.display="none";
    applyRole(); render(); toastMsg(t("dlgSaved"));
  });
}

function projectRef(){
  var c=cloudCfg(); if(!c||!c.url) return "";
  var m=normaliseUrl(c.url).match(/^https:\/\/([a-z0-9]+)\.supabase\.co/i);
  return m?m[1]:"";
}

/* ---------- actions ---------- */
function setMeal(date,memberId,count){
  var i=-1;
  for(var k=0;k<state.meals.length;k++){
    if(state.meals[k].date===date && state.meals[k].memberId===memberId){i=k;break;}
  }
  if(count<=0){ if(i>=0) state.meals.splice(i,1); }
  else if(i>=0) state.meals[i].count=count;
  else state.meals.push({id:uid("me"),date:date,memberId:memberId,count:count});
  save(); render();
}
function exportCsv(){
  var s=summary(), cb=cashBalance(), inv=Number(state.inventoryValue)||0, L=[];
  L.push(csvR(["Mess Ledger Report \u2014 "+monthLabel(month)]));
  L.push(csvR(["Generated "+todayISO()]));
  L.push("");
  L.push(csvR(["Cash balance (present, all-time)",cb.toFixed(2)]));
  L.push(csvR(["Inventory value",inv.toFixed(2)]));
  L.push(csvR(["Present balance (cash + inventory)",(cb+inv).toFixed(2)]));
  L.push("");
  var shopRows=computeShopPayables();
  if(shopRows.length){
    L.push(csvR(["Owed to shops"]));
    L.push(csvR(["Shop / Vendor","Owed"]));
    shopRows.forEach(function(r){ L.push(csvR([r.vendor, r.owed.toFixed(2)])); });
    L.push("");
  }
  L.push(csvR(["Total mess expense this month",s.totalExpense.toFixed(2)]));
  L.push(csvR(["Total meals this month",s.totalMeals]));
  L.push(csvR(["Meal rate (expense / meals)",s.rate.toFixed(4)]));
  L.push("");
  L.push(csvR(["Member","Contribution","Expense (paid by member)","Withdrawal","Total Paid",
    "Meals Eaten","Meal Cost","Opening Balance","This Month","Closing Balance"]));
  s.rows.forEach(function(r){
    L.push(csvR([r.member.name,r.contribution.toFixed(2),r.expense.toFixed(2),r.withdrawal.toFixed(2),
      r.totalPaid.toFixed(2),r.mealCount,r.mealCost.toFixed(2),r.opening.toFixed(2),
      r.monthBalance.toFixed(2),r.closing.toFixed(2)]));
  });
  var T=s.totals;
  L.push(csvR(["Total",T.contribution.toFixed(2),T.expense.toFixed(2),T.withdrawal.toFixed(2),
    T.totalPaid.toFixed(2),T.mealCount,T.mealCost.toFixed(2),T.opening.toFixed(2),
    T.monthBalance.toFixed(2),T.closing.toFixed(2)]));
  L.push("");
  L.push(csvR(["Legend"]));
  L.push(csvR(["Cash balance","All contributions ever received, minus general mess expenses and member withdrawals."]));
  L.push(csvR(["Inventory value","Manually entered value of unused stock on hand."]));
  L.push(csvR(["Contribution","Cash the member put into the mess fund this month."]));
  L.push(csvR(["Expense (paid by member)","Money the member spent for the mess, to be reimbursed."]));
  L.push(csvR(["Withdrawal","Money paid back to the member, e.g. returning an advance when leaving."]));
  L.push(csvR(["Shop credit","Money owed to a shop for goods bought on credit \u2014 counts toward meal cost immediately but not cash balance until paid."]));
  L.push(csvR(["Pay a shop","Paying off shop credit \u2014 reduces cash balance, does not add to meal cost again."]));
  L.push(csvR(["Total Paid","Contribution + Expense - Withdrawal"]));
  L.push(csvR(["Meal Cost","Meals Eaten x Meal Rate"]));
  L.push(csvR(["Opening Balance","Balance carried forward from all previous months."]));
  L.push(csvR(["This Month","Total Paid - Meal Cost, for this month only."]));
  L.push(csvR(["Closing Balance","Opening + This Month. Positive = advance, carried to next month. Negative = due."]));
  L.push("");
  L.push(csvR(["Entries this month"]));
  L.push(csvR(["Date","Member","Type","Amount","Note"]));
  s.tx.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(x){
    var m=state.members.filter(function(y){return y.id===x.memberId;})[0];
    L.push(csvR([x.date,m?m.name:"Mess",x.type,Number(x.amount).toFixed(2),x.note||""]));
  });
  download("mess-ledger-report-"+month+".csv",L.join("\n"),"text/csv");
}
