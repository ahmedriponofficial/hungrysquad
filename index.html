document.addEventListener("click",function(ev){
  var el = ev.target.closest("[data-tab],[data-act],[data-expand],[data-meal],[data-pickday],[data-scope],[data-deltx],[data-toggle],[data-cooktoggle],[data-setpage],[data-editname],[data-memmenu],[data-pickcook],[data-reqok],[data-reqno],[data-vendor],[data-cookdates],[data-ftype],[data-delmem],[data-editavatar],[data-perm],[data-dep]");
  if(!el) return;

  // Looking, not touching: members may only move around the app.
  if(guestMode){
    var harmless = el.dataset.tab || el.dataset.expand || el.dataset.pickday || el.dataset.scope || el.dataset.ftype
                || el.dataset.act === "toggleTheme" || el.dataset.act === "exportCsv"
                || el.dataset.act === "dismissToast" || el.dataset.act === "adminLogin" || el.dataset.act === "refreshTeam"
                // asking to cook is the one thing a member may do
                || el.dataset.act === "gotoAsk" || el.dataset.act === "sendCookReq"
                || el.dataset.act === "switchReqWho" || el.dataset.pickcook || el.dataset.cookdates;
    if(!harmless) return;
  }
  // A deputy only does what the manager allowed.
  if(deputyMode){
    if(!state.deputyPerms.enabled){
      var ok = el.dataset.tab||el.dataset.expand||el.dataset.pickday||el.dataset.scope||el.dataset.ftype||el.dataset.cookdates||el.dataset.act==="toggleTheme"||el.dataset.act==="exportCsv";
      if(!ok) return;
    }
    if(el.dataset.meal && !deputyMay("addMeals")) return;
    if(el.dataset.act === "addTx" && !deputyMay("addMoney")) return;
    if((el.dataset.deltx || el.dataset.delmem) && !deputyMay("deleteEntries")) return;
    if((el.dataset.act === "addMember" || el.dataset.toggle || el.dataset.cooktoggle || el.dataset.editavatar || el.dataset.editname) && !deputyMay("members")) return;
  }

  if(el.dataset.perm){ state.perms[el.dataset.perm] = !state.perms[el.dataset.perm]; save(); render(); return; }
  if(el.dataset.dep){
    var dk = el.dataset.dep;
    if(dk!=="enabled" && !state.deputyPerms.enabled) return;
    state.deputyPerms[dk] = !state.deputyPerms[dk];
    save(); render(); return;
  }
  if(el.dataset.act==="refreshTeam"){ refreshTeam(false); return; }
  if(el.dataset.act==="pushNow"){ pushCloud(false); return; }
  if(el.dataset.act==="pullNow"){
    setSyncNote("Checking\u2026");
    pullIfNewer(false).then(function(got){ if(!got) setSyncNote("Nothing new \u2014 you already have the latest."); });
    return;
  }
  if(el.dataset.act==="cloudSetup"){ openCloudSetup(); return; }
  if(el.dataset.act==="adminLogin"){ openAdminLogin(); return; }
  if(el.dataset.act==="adminSignOut"){ adminSignOut(); return; }
  if(el.dataset.act==="securityCheck"){ runSecurityCheck(); return; }
  if(el.dataset.act==="memberLink"){ showLink(false); return; }
  if(el.dataset.act==="deputyLink"){ showLink(true); return; }
  if(el.dataset.act==="revokeDeputy"){
    state.deputyPerms.token = uid("d");
    save(); render(); toastMsg("Old deputy link revoked");
    return;
  }
  if(el.dataset.tab){ tab=el.dataset.tab; window.__setPage=null; fabActive=false; if(tab==="transactions") window.__moneyView="list"; expandedId=null; render(); return; }
  if(el.dataset.expand){ expandedId = expandedId===el.dataset.expand?null:el.dataset.expand; render(); return; }
  if(el.dataset.meal){
    var cur=0;
    state.meals.forEach(function(m){ if(m.date===window.__mealDate && m.memberId===el.dataset.meal) cur=m.count; });
    setMeal(window.__mealDate, el.dataset.meal, Math.max(0,cur+Number(el.dataset.delta)));
    return;
  }
  if(el.dataset.pickday){ window.__mealDate=el.dataset.pickday; render(); return; }
  if(el.dataset.scope){ window.__filter.scope=el.dataset.scope; render(); return; }
  if(el.dataset.ftype){ window.__filter.type=el.dataset.ftype; render(); return; }
  if(el.dataset.deltx){
    var k="tx"+el.dataset.deltx;
    if(armed[k]){
      state.transactions=state.transactions.filter(function(x){return x.id!==el.dataset.deltx;});
      armed[k]=false; save();
    } else armed[k]=true;
    render(); return;
  }
  if(el.dataset.editavatar){
    window.__editAvatarId = el.dataset.editavatar;
    render();
    setTimeout(function(){ var i=document.getElementById("avatarInput"); if(i){ i.focus(); i.select(); } },0);
    return;
  }
  if(el.dataset.vendor){
    (window.__moneyForm||{}).vendor = el.dataset.vendor; render(); return;
  }
  if(el.dataset.cookdates){
    window.__cookDates = (window.__cookDates===el.dataset.cookdates) ? null : el.dataset.cookdates;
    render(); return;
  }
  if(el.dataset.pickcook){ window.__reqDate=el.dataset.pickcook; render(); return; }
  if(el.dataset.reqok){
    var bd=el.dataset.reqdate, bw=el.dataset.reqwho;
    decideCookReq(el.dataset.reqok,true,bd,bw).then(function(ok){
      toastMsg(ok?bw+" \u2014 "+t("approved"):t("couldNotSend")); fetchCookReqs(); });
    return;
  }
  if(el.dataset.reqno){
    decideCookReq(el.dataset.reqno,false).then(function(ok){
      toastMsg(ok?t("declined"):t("couldNotSend")); fetchCookReqs(); });
    return;
  }
  if(el.dataset.memmenu){ window.__memSheet=el.dataset.memmenu; window.__memSheetMode=null; render(); return; }
  if(el.dataset.editname){
    window.__editNameId = el.dataset.editname; render();
    setTimeout(function(){ var i=document.getElementById("nameInput"); if(i){ i.focus(); i.select(); } },0);
    return;
  }
  if(el.dataset.setpage){
    window.__setPage=el.dataset.setpage; render(); window.scrollTo({top:0}); return;
  }
  if(el.dataset.cooktoggle){
    state.members.forEach(function(m){ if(m.id===el.dataset.cooktoggle) m.cooks = (m.cooks===false); });
    save(); render(); return;
  }
  if(el.dataset.toggle){ window.__memSheet=null;
    state.members.forEach(function(m){
      if(m.id!==el.dataset.toggle) return;
      if(m.active===false){ m.active=true; delete m.leftOn; delete m.leftAt; }
      else { m.active=false; m.leftOn=todayISO(); m.leftAt=Date.now(); }
    });
    save(); render(); return;
  }
  if(el.dataset.delmem){ if(armed["mem"+el.dataset.delmem]) window.__memSheet=null;
    var k2="mem"+el.dataset.delmem;
    if(armed[k2]){
      state.members=state.members.filter(function(m){return m.id!==el.dataset.delmem;});
      armed[k2]=false; save();
    } else armed[k2]=true;
    render(); return;
  }

  var a=el.dataset.act;
  if(a==="toggleTheme"){ state.themeMode = state.themeMode==="dark"?"light":"dark"; save(); render(); }
  else if(a==="addMember"){
    var n=(document.getElementById("newMember").value||"").trim();
    if(n){ state.members.push({id:uid("m"),name:n,active:true,joinedOn:todayISO()}); save(); render(); }
  }
  else if(a==="addTx"){
    var f=window.__moneyForm;
    var isShop=(f.type==="payable"||f.type==="payable_payment");
    f.date=document.getElementById("fDate").value;
    f.type=document.getElementById("fType").value;
    if(isShop){
      var vEl=document.getElementById("fVendor");
      f.vendor = vEl ? vEl.value.trim() : (f.vendor||"");
    } else {
      var mEl=document.getElementById("fMember");
      f.memberId = mEl ? mEl.value : f.memberId;
    }
    f.amount=document.getElementById("fAmount").value;
    f.note=document.getElementById("fNote").value;
    var amt=parseAmt(f.amount);
    if(!isFinite(amt)||amt<=0){
      var ai=document.getElementById("fAmount");
      if(ai){ ai.className="key err"; ai.focus(); }
      return;
    }
    if(isShop && !(f.vendor||"").trim()){
      var vi=document.getElementById("fVendor");
      if(vi){ vi.style.borderColor="var(--neg)"; vi.focus(); }
      return;
    }
    state.transactions.push({id:uid("t"),createdAt:Date.now(),date:f.date,type:f.type,
      memberId: isShop ? null : ((f.type==="expense"&&f.memberId==="__mess__")?null:f.memberId),
      vendor: isShop ? f.vendor.trim() : undefined,
      amount:amt,note:(f.note||"").trim()});
    f.amount=""; f.note="";
    save(); render();
    toastMsg(t("entryAdded"));
  }
  else if(a==="exportCsv"){ exportCsv(); }
  else if(a==="gotoMoney"){ tab="transactions"; window.__moneyView="add"; fabActive=true; expandedId=null; render(); }
  else if(a==="useSuggestedCookToday"){
    var sgT=suggestCook(todayISO());
    if(sgT){ setCook(todayISO(), sgT.id); save(); render(); toastMsg(sgT.name+" \u2014 "+t("cook")); }
  }
  else if(a==="gotoAsk"){ tab="ask"; expandedId=null; render(); window.scrollTo({top:0}); }
  else if(a==="gotoCookRota"){
    tab="meals"; window.__mealDate=todayISO(); fabActive=false; expandedId=null; render();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  else if(a==="copyDbUrl"){
    var c=cloudCfg()||{}; copyStr(normaliseUrl(c.url||""), t("copied"));
  }
  else if(a==="sendCookReq"){
    var nEl=document.getElementById("reqNote");
    var note=nEl?nEl.value.trim():"";
    if(!window.__reqDate){ toastMsg(t("pickDayFirst")); return; }
    var wEl=document.getElementById("reqWho");
    var whoId=wEl?wEl.value:(window.__reqWho||"");
    window.__reqWho=whoId;
    sendCookReq(window.__reqDate, note, whoId).then(function(ok){
      if(ok){ window.__reqDate=null; window.__reqNote=""; toastMsg(t("requestSent")); fetchCookReqs(); }
      else toastMsg(t("couldNotSend"));
    });
  }
  else if(a==="switchReqWho"){ window.__reqWho=null; window.__reqDate=null; render(); }
  else if(a==="closeMemSheet"){ window.__memSheet=null; window.__memSheetMode=null; render(); }
  else if(a==="memAvatar"){ window.__memSheetMode="avatar"; render();
    setTimeout(function(){ var i=document.getElementById("avatarInput"); if(i){ i.focus(); i.select(); } },0); }
  else if(a==="memRename"){ window.__memSheetMode="rename"; render();
    setTimeout(function(){ var i=document.getElementById("nameInput"); if(i){ i.focus(); i.select(); } },0); }
  else if(a==="setBack"){ window.__setPage=null; render(); window.scrollTo({top:0}); }
  else if(a==="gotoMeals"){ tab="meals"; window.__mealDate=todayISO(); fabActive=false; expandedId=null; render(); }
  else if(a==="useSuggestedCook"){
    var dd=window.__mealDate||todayISO(), sg=suggestCook(dd);
    if(sg){ setCook(dd, sg.id); save(); render(); toastMsg(sg.name+" \u2014 "+t("cook")); }
  }
  else if(a==="moneyViewAdd"){ window.__moneyView="add"; fabActive=true; render(); }
  else if(a==="moneyViewList"){ window.__moneyView="list"; fabActive=false; render(); }
  else if(a==="exportBackup"){
    download("mess-ledger-backup-"+todayISO()+".json",JSON.stringify(state,null,2),"application/json");
  }
  else if(a==="pickRestore"){ document.getElementById("fileIn").click(); }
  else if(a==="dismissToast"){
    clearTimeout(bkToastTimer);
    document.getElementById("bkToast").className="toast hide";
  }
  else if(a==="toggleAuto"){ state.autoBackup=!state.autoBackup; save(); render(); }
  else if(a==="toggleInv"){ state.inventoryEnabled=!state.inventoryEnabled; save(); render(); }
  else if(a==="toggleBkToast"){ state.showBackupToast=!state.showBackupToast; save(); render(); }
  else if(a==="connectGoogle"){ connectGoogle(); }
  else if(a==="disconnectGoogle"){ disconnectGoogle(); }
  else if(a==="sendBackup"){
    var note=document.getElementById("mailNote");
    if(note){ note.textContent=t("sending"); note.style.color="var(--ink3)"; }
    sendEmailBackup(true,function(ok,why){
      var n=document.getElementById("mailNote");
      if(n){
        n.textContent = ok ? t("backupSent") : t("backupFailed")+" ("+why+")";
        n.style.color = ok ? "var(--pos)" : "var(--neg)";
      }
      if(ok) render();
      renderBanner();
    });
  }
});

document.addEventListener("input",function(ev){
  var id=ev.target.id;
  if(id==="fAmount"){
    window.__moneyForm.amount=ev.target.value;
    ev.target.className="key";
  }
  else if(id==="fNote"){ window.__moneyForm.note=ev.target.value; }
});

document.addEventListener("change",function(ev){
  var id=ev.target.id;
  if(id==="mealDate"){ window.__mealDate=ev.target.value; render(); }
  else if(id==="cookSel"){ setCook(window.__mealDate||todayISO(), ev.target.value||null); save(); render(); }
  else if(id==="fType"||id==="fMember"||id==="fDate"){
    var f=window.__moneyForm;
    var dEl=document.getElementById("fDate"); if(dEl) f.date=dEl.value;
    var tEl=document.getElementById("fType"); if(tEl) f.type=tEl.value;
    var mEl=document.getElementById("fMember"); if(mEl) f.memberId=mEl.value;
    var aEl=document.getElementById("fAmount"); if(aEl) f.amount=aEl.value;
    var nEl=document.getElementById("fNote"); if(nEl) f.note=nEl.value;
    if(f.type!=="expense" && f.memberId==="__mess__") f.memberId=(state.members[0]||{}).id||"";
    render();
  }
  else if(id==="fVendor"){ window.__moneyForm.vendor=ev.target.value; }
  else if(ev.target.dataset && ev.target.dataset.namefor){
    var nid=ev.target.dataset.namefor, nv=ev.target.value.trim().slice(0,40);
    if(nv) state.members.forEach(function(m){ if(m.id===nid) m.name=nv; });
    window.__editNameId=null; window.__memSheetMode=null; save(); render();
  }
  else if(ev.target.dataset && ev.target.dataset.joinfor){
    var jid=ev.target.dataset.joinfor, jv=ev.target.value;
    state.members.forEach(function(m){ if(m.id===jid){ if(jv) m.joinedOn=jv; else delete m.joinedOn; } });
    save(); render();
  }
  else if(ev.target.dataset && ev.target.dataset.avatarfor){
    var mid=ev.target.dataset.avatarfor;
    var val=ev.target.value.trim().slice(0,8);
    state.members.forEach(function(m){ if(m.id===mid) m.avatar=val||undefined; });
    window.__editAvatarId=null; window.__memSheetMode=null;
    save(); render();
  }
  else if(id==="filtMember"){ window.__filter.member=ev.target.value; render(); }
  else if(id==="langSel"){ state.lang=ev.target.value; save(); render(); }
  else if(id==="currSel"){ state.currency=ev.target.value; save(); render(); }
  else if(id==="messNameInput"){ state.messName=ev.target.value.trim().slice(0,40); save(); renderHeader(); }
  else if(id==="gClientId"){ state.googleClientId=ev.target.value.trim(); persistLocalOnly(); }
  else if(id==="invVal"){
    var v=parseAmt(ev.target.value);
    state.inventoryValue=isFinite(v)?v:0; save();
  }
  else if(ev.target.dataset && ev.target.dataset.mealset){
    var v2=parseInt(ev.target.value,10);
    setMeal(window.__mealDate, ev.target.dataset.mealset, isNaN(v2)?0:Math.max(0,v2));
  }
  else if(id==="fileIn"){
    var file=ev.target.files&&ev.target.files[0];
    if(!file) return;
    var rd=new FileReader();
    rd.onload=function(){
      var note=document.getElementById("importNote");
      try{
        var p=JSON.parse(rd.result);
        if(!p.members||!p.transactions||!p.meals){
          note.textContent="That file doesn't look like a Mess Ledger backup.";
          note.style.color="var(--neg)"; return;
        }
        if(confirm(t("replaceWarn"))){
          // run the file through the normal loader, so every field
          // (cooking rota, permissions, currency, mess name...) is rebuilt —
          // the old shortcut kept only six fields and crashed on the rest
          localStorage.setItem(KEY, JSON.stringify(p));
          load();
          save(); render();
          toastMsg(t("restored"));
        }
      }catch(e){
        note.textContent="Couldn't read that file.";
        note.style.color="var(--neg)";
      }
    };
    rd.readAsText(file);
    ev.target.value="";
  }
});

/* ---------- month picker sheet ---------- */
var MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var pickerYear = null;

function monthsWithData(){
  var set={};
  state.transactions.forEach(function(x){set[mKey(x.date)]=1;});
  state.meals.forEach(function(x){set[mKey(x.date)]=1;});
  return set;
}
function openPicker(){
  pickerYear = parseInt(month.split("-")[0],10);
  renderPicker();
}
function closePicker(){
  document.getElementById("sheet").innerHTML="";
}
function renderPicker(){
  var has = monthsWithData();
  var curY = parseInt(month.split("-")[0],10);
  var curM = parseInt(month.split("-")[1],10);
  var h='<div class="scrim" data-closepicker="1"><div class="sheet" data-stop="1">'+
    '<div class="grab"></div>'+
    '<div class="yearrow">'+
    '<button class="ybtn" data-year="-1"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>'+
    '<div class="y">'+pickerYear+'</div>'+
    '<button class="ybtn" data-year="1"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>'+
    '</div><div class="mgrid">';
  for(var i=1;i<=12;i++){
    var key = pickerYear+"-"+(i<10?"0":"")+i;
    var on = (pickerYear===curY && i===curM);
    h+='<button class="mcell'+(on?" on":"")+(has[key]?" hasdata":"")+'" data-pickmonth="'+key+'">'+
       MONTH_ABBR[i-1]+'</button>';
  }
  h+='</div><div class="foot"><button class="b ghost wide" data-pickmonth="'+todayISO().slice(0,7)+'">This month</button></div>';
  h+='</div></div>';
  document.getElementById("sheet").innerHTML=h;
}

document.getElementById("monthBtn").addEventListener("click",openPicker);

document.addEventListener("click",function(ev){
  if(ev.target.closest("[data-pickmonth]")){
    month = ev.target.closest("[data-pickmonth]").dataset.pickmonth;
    expandedId=null; closePicker(); render();
    if(state.googleConnected) pushToSheet();
    return;
  }
  if(ev.target.closest("[data-year]")){
    pickerYear += Number(ev.target.closest("[data-year]").dataset.year);
    renderPicker(); return;
  }
  if(ev.target.closest("[data-stop]")) return;
  if(ev.target.closest("[data-closepicker]")) closePicker();
});

loadAdmin();
applyRole();                 // signed-in admin = editor, everyone else = read-only
load();
render();
if(guestMode){
  refreshTeam(true);
  fetchCookReqs();
} else {
  scheduleAutoBackup();
  if(cloudReady()){
    pullIfNewer(false).then(function(){ autoSecurityCheck(); });   // pull FIRST, so we never overwrite the cloud with an empty copy
    fetchCookReqs();
  }
}

// keep an eye out for new requests while the app is open
setInterval(function(){
  if(!document.hidden && (teamCfg || cloudReady())) fetchCookReqs();
}, 60000);

document.addEventListener("visibilitychange", function(){
  if(document.hidden) return;
  if(teamCfg) refreshTeam(false);
  else if(cloudReady()) pullIfNewer(true);
  if(teamCfg || cloudReady()) fetchCookReqs();
});
</script>
